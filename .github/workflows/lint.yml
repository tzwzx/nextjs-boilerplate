name: Lint

on: [push]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-bun
      - run: bun lint
      - run: bun typecheck
      - run: bun stylelint
      - run: bun syncpack:lint
      - run: bun fallow
      - run: bunx cspell-check-unused-words
